# ============================================================
# 飞书 Bitable 电子签名 - Nginx 配置 (宝塔面板)
# ============================================================
# 使用方法:
#   1. 在宝塔面板 → 网站 → 添加站点 (绑定域名)
#   2. 站点设置 → 配置文件，将此内容替换进去
#   3. 修改 your-domain.com 为你的实际域名
#   4. 在宝塔 SSL 中申请免费证书
# ============================================================

# 上游 Node.js 服务
upstream esign_backend {
    server 127.0.0.1:3001;
    # 如果多实例负载，可加更多:
    # server 127.0.0.1:3002;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    # 证书申请后自动添加跳转，此处保留备用
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书路径 (宝塔自动填写)
    ssl_certificate     /www/server/ssl/your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/ssl/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 日志
    access_log /www/wwwlogs/esign.access.log;
    error_log  /www/wwwlogs/esign.error.log;

    # 上传文件大小限制 (签名图片)
    client_max_body_size 20m;

    # ============================================================
    # API 接口反代
    # ============================================================
    location /api/ {
        proxy_pass http://esign_backend;
        proxy_set_header Host           $host;
        proxy_set_header X-Real-IP      $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持 (预留)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # 签名图片静态资源反代
    # ============================================================
    location /uploads/ {
        proxy_pass http://esign_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 缓存静态图片
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # H5 签字页面 (SPA, 由 Express 托管)
    # ============================================================
    location /h5 {
        proxy_pass http://esign_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # H5 SPA 路由 fallback (Vue Router history 模式)
    location /h5/ {
        proxy_pass http://esign_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Widget 插件 (飞书多维表格自定义小组件, 由 Express 托管)
    # ============================================================
    location /widget {
        proxy_pass http://esign_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /widget/ {
        proxy_pass http://esign_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 健康检查
    # ============================================================
    location /health {
        proxy_pass http://esign_backend;
        access_log off;
    }

    # ============================================================
    # 根路径 (可选: 显示欢迎页或重定向到 H5)
    # ============================================================
    location = / {
        return 302 /h5/;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
